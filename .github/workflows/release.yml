name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint
        uses: lunarmodules/luacheck@v1

      - name: Check tag matches TOC version
        run: |
          toc=$(grep -m1 '^## Version:' EspiUtils.toc | sed 's/^## Version: *//' | tr -d '\r')
          if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $toc"; exit 1
          fi

      - uses: BigWigsMods/packager@v2
